<!DOCTYPE html>
<html>
<head>
    <title>Student Portal - Registrar's Office</title>
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-container { background: white; width: 400px; margin: auto; padding: 30px; border-radius: 12px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #1a3e6f; color: white; padding: 12px; width: 100%; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🏫 University Registrar</h2>
    <p>Student Portal | Secure Login</p>
    <form action="" method="POST">
        <input type="text" name="username" placeholder="Student ID or Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login to Portal</button>
    </form>
</div>
<div style="background: #f8f9fa; padding: 10px; margin-top: 20px; text-align: center; font-size: 12px; color: #666; border-top: 1px solid #ddd;">
    ⚠️ This is a controlled security simulation for educational purposes. No real credentials are stored.
</div>
</body>
</html>
